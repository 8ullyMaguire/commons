[package]
name = "commons-scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
commons-core = { workspace = true }
commons-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
xxhash-rust = { workspace = true }
rayon = { workspace = true }
camino = { workspace = true }
libc = { workspace = true }
notify = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[[bench]]
name = "scan_100k"
# `harness = false` because this benchmark is a gate, not a measurement tool:
# it prints a pass/fail line and exits non-zero, which the default libtest
# harness cannot express. A criterion benchmark reports numbers and always
# exits 0, so it cannot be a gate -- see the header for why this one is
# hand-rolled rather than criterion.
harness = false
