[package]
name = "commons-tokens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

# No dependencies at all, runtime or build: the tokens are baked in at compile time from the same
# JSON the CSS is generated from, so there is nothing to parse at runtime and nothing to drift.
[dependencies]

[build-dependencies]
serde_json = { workspace = true }

# Tests read ui/tokens/tokens.json directly, independently of build.rs, and compare it against the
# compiled constants. A test that re-used the build script's own parse could not catch the build
# script dropping a group.
[dev-dependencies]
serde_json = { workspace = true }
