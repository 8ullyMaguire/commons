[package]
name = "commons-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Only what Phase 0 uses. The layering test fails on a dependency the table
# does not permit, so unused crates are not listed "just in case" -- they are
# added when the phase that needs them lands.
commons-core = { workspace = true }
commons-store = { workspace = true }
commons-plugin = { workspace = true }
# T-P6-001: the on-demand proxy transcodes, and `commons-media` is the only
# crate that knows how. The layering table in `commons-store/tests/layering.rs`
# is amended in the same commit -- a dependency added without amending the
# table is a test failure, which is the point of having one.
commons-media = { workspace = true }
# T-P6-003: the funscript route serves a PARSED timeline, and parsing lives in
# `commons-scan` beside the parser (T-P1-007). The alternative -- reimplementing
# the parse here, or amending the table to let `commons-media` depend on
# `commons-scan` -- would put a second JSON parser in the codebase, and two
# parsers is two sets of opinions about what a malformed script means.
commons-scan = { workspace = true }
# T-P5-007 part 2B. A share link is a CAPABILITY GRANT and the policy for one
# lives in `commons-consent` (`share.rs`) beside every other consent decision --
# so the route calls `resolve` rather than reimplementing "revoked before
# expired, signature before policy". The layering table already permits this
# edge (see `commons-store/tests/layering.rs`), so no amendment is needed here.
commons-consent = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "postgres"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
# T-P6-007: the /api/v1 OpenAPI document. See the workspace entry for why
# `utoipa-axum` is deliberately absent.
utoipa = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }
# T-P5-007 part 2B: grant lifetimes and the ISO-8601 stamps on the wire.
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
# To read a response body out of an axum `Response` in a test: `Body` implements
# no `read_to_end`, and collecting it needs `BodyExt` from this crate. It is a
# dev-dependency because nothing in the server itself collects a body.
http-body-util = "0.1"
# The route tests seed objects and files the way `media_db.rs` does, so they
# need the same SQL access and the same UUID source.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "postgres"] }
uuid = { workspace = true, features = ["v4"] }
