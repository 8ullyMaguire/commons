[package]
name = "commons-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Only what Phase 0 uses. The layering test fails on a dependency the table
# does not permit, so unused crates are not listed "just in case" -- they are
# added when the phase that needs them lands.
commons-core = { workspace = true }
commons-store = { workspace = true }
commons-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
