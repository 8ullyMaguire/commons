[package]
name = "commons-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Only what Phase 0 uses. The layering test fails on a dependency the table
# does not permit, so unused crates are not listed "just in case" -- they are
# added when the phase that needs them lands.
commons-core = { workspace = true }
commons-store = { workspace = true }
commons-plugin = { workspace = true }
# T-P6-001: the on-demand proxy transcodes, and `commons-media` is the only
# crate that knows how. The layering table in `commons-store/tests/layering.rs`
# is amended in the same commit -- a dependency added without amending the
# table is a test failure, which is the point of having one.
commons-media = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "postgres"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
# To read a response body out of an axum `Response` in a test: `Body` implements
# no `read_to_end`, and collecting it needs `BodyExt` from this crate. It is a
# dev-dependency because nothing in the server itself collects a body.
http-body-util = "0.1"
# The route tests seed objects and files the way `media_db.rs` does, so they
# need the same SQL access and the same UUID source.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "postgres"] }
uuid = { workspace = true, features = ["v4"] }
