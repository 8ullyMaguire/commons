# T-P6-006: `uuid` and `semver` were both declared here and used NOWHERE in
# this crate -- verified with `grep -rE '\bsemver::|\buuid::' src/`, not
# assumed. `is_semver` in lib.rs is hand-rolled on purpose so the version
# rule sits next to the test that pins it; see its doc comment for why the
# crate is not the better answer. A dependency nobody calls is one
# `unused_crate_dependencies` warning away from being noise.

[dev-dependencies]
# `propose_locator` is a real database write, so the tests that exercise the
# host API need a real store. That is the point: the previous test passed
# against a stub that wrote nothing.
tempfile = { workspace = true }
sqlx = { workspace = true }
