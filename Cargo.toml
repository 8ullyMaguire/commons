[workspace]
resolver = "2"
members = [
    "crates/commons-core",
    "crates/commons-store",
    "crates/commons-scan",
    "crates/commons-jobs",
    "crates/commons-media",
    "crates/commons-ml",
    "crates/commons-identity",
    "crates/commons-index",
    "crates/commons-consent",
    "crates/commons-federation",
    "crates/commons-plugin",
    "crates/commons-api",
    "crates/commons-server",
    "crates/commons-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
# AGPL-3.0-only. Section 13 of the license requires that users interacting with
# the software over a network be offered its source. Commons is meant to be run
# as a public index, so that condition is the point of the choice rather than an
# obstacle to it: a public instance must offer its source to the people it serves.
license = "AGPL-3.0-only"
repository = "https://github.com/commons-media/commons"
homepage = "https://github.com/commons-media/commons"
authors = ["The Commons contributors"]

[workspace.dependencies]
commons-core = { path = "crates/commons-core" }
commons-store = { path = "crates/commons-store" }
commons-scan = { path = "crates/commons-scan" }
commons-jobs = { path = "crates/commons-jobs" }
commons-media = { path = "crates/commons-media" }
commons-ml = { path = "crates/commons-ml" }
commons-identity = { path = "crates/commons-identity" }
commons-index = { path = "crates/commons-index" }
commons-consent = { path = "crates/commons-consent" }
commons-federation = { path = "crates/commons-federation" }
commons-plugin = { path = "crates/commons-plugin" }
commons-api = { path = "crates/commons-api" }

# Third-party. Pinned minor versions; crates reference these as workspace=true
# so a version cannot drift between members.
anyhow = "1.0"
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.41", features = ["full"] }
tokio-util = "0.7"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "sqlite",
    "macros",
    "uuid",
    "json",
    "migrate",
] }
async-graphql = "7.0"
async-graphql-axum = "7.0"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
blake3 = "1.5"
# URL-safe token encoding for share links (T-P5-007 §9.5). std has no base64.
base64 = "0.22"
# Token secrets. rand 0.9 renamed `thread_rng` -> `rng`, and the workspace is
# on 0.9, so a 0.8-style import does not compile.
rand = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
wasmtime = "24"
ort = "2.0"
usearch = "2.0"
notify = "7.0"
rayon = "1.10"
image = "0.25"
sha2 = "0.10"
ed25519-dalek = "2.1"
semver = "1.0"
camino = "1.1"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
zip = { version = "5", default-features = false, features = ["deflate", "bzip2", "time", "aes-crypto"] }
sevenz-rust2 = "0.9"
unrar = "0.5"
tar = "0.4"
flate2 = "1"
libc = "0.2"
tempfile = "3"
regex = "1.11"
toml = "0.8"
